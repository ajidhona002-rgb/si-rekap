<div class="hero"><div class="hw"><div class="logo">🏫</div><div><h1>Rekap Absensi Pembelajaran</h1><p>SMK Negeri 1 Sungai Rumbai</p><span class="pill" id="role"></span></div></div></div>

<div id="stats"></div>

<div id="v"></div>
</main>
<script>
const D={siswa:[],absen:{},apel:{},guru:[]};
const JUR=["DPIB","TKP","TELIN","TP","TPM","DGM","TITL A","TITL B","TOI A","TOI B","TSM"];
const KELAS=[];[10,11,12].forEach(l=>JUR.forEach(j=>KELAS.push(l+" "+j)));
const ST={H:"Hadir",S:"Sakit",I:"Izin",A:"Alpa",C:"Cabut"};
let dl=null,db=null,st="load",isAdmin=false,canWrite=false,isAdm=false,tab="home",sel=null;
let f={kelas:KELAS[0],dari:"",sampai:"",fm:"",mapel:"",guru:"",piket:"",jd:1,js:2,tgl:new Date().toISOString().slice(0,10)};
try{Object.assign(f,JSON.parse(sessionStorage.getItem("f")||"{}"));tab=sessionStorage.getItem("tab")||tab}catch(e){}
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const kopt=v=>KELAS.map(k=>`<option ${k===v?"selected":""}>${k}</option>`).join("");
const byKelas=k=>D.siswa.filter(s=>s.kelas===k).sort((a,b)=>a.nama.localeCompare(b.nama));
const aid=(t,k,m,a,b)=>[t,k,m,a,b].join("_").replace(/[ \/.#$\[\]]/g,"-");
const gurus=()=>[...new Set([...D.guru.map(g=>g.nama),...Object.values(D.absen).map(a=>a.guru).filter(Boolean)])].sort((a,b)=>a.localeCompare(b));
const mapels=()=>[...new Set(["Matematika","Bahasa Indonesia","Bahasa Inggris","PAI","PPKn","PJOK","Sejarah Indonesia","Informatika","Projek IPAS","Dasar Kejuruan","Produktif",...Object.values(D.absen).map(a=>a.mapel).filter(Boolean)])];
function keep(){try{sessionStorage.setItem("f",JSON.stringify(f));sessionStorage.setItem("tab",tab)}catch(e){}}
let tt=null;
function notify(m){let t=$("#toast");if(!t){t=document.createElement("div");t.id="toast";t.setAttribute("role","status");document.body.appendChild(t)}t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>{t.hidden=true},4200)}
function modal(html){const o=document.createElement("div");o.className="ovl";o.innerHTML='<div class="mdl">'+html+'</div>';document.body.appendChild(o);o.close=()=>o.remove();return o}
function ask(msg){return new Promise(r=>{const o=modal(`<p>${esc(msg)}</p><div class="row" style="justify-content:flex-end;margin:0"><button class="btn" data-x="0">Batal</button><button class="btn p" data-x="1">Ya, lanjutkan</button></div>`);o.onclick=e=>{const b=e.target.closest("[data-x]");if(b){o.close();r(b.dataset.x==="1")}else if(e.target===o){o.close();r(false)}}})}
/* Penyimpanan online: setiap dokumen di database = satu kelas (siswa), satu sesi (absen), satu hari-kelas (apel). */
const R=new Map();
const cj=v=>JSON.stringify(v,(k,x)=>x&&typeof x==="object"&&!Array.isArray(x)?Object.keys(x).sort().reduce((o,i)=>(o[i]=x[i],o),{}):x);
const kid=k=>k.replace(/[^A-Za-z0-9_.-]/g,"-");
function sid(s){let t=s.replace(/[^A-Za-z0-9_.\-]/g,c=>"~"+c.charCodeAt(0).toString(16)+"~");if(t.length>190){let h=0;for(const ch of s)h=(h*31+ch.charCodeAt(0))|0;t=t.slice(0,180)+"~"+(h>>>0).toString(36)}return t}
function want(){
  const m=new Map(),by={};
  D.siswa.forEach(x=>{(by[x.kelas]=by[x.kelas]||[]).push({id:x.id,nis:x.nis,nama:x.nama})});
  Object.entries(by).forEach(([k,list])=>m.set("siswa/"+kid(k),{kelas:k,list}));
  if(D.guru.length||R.has("config/guru"))m.set("config/guru",{list:D.guru});
  if(D.pw)m.set("config/pw",{s:D.pw.s,h:D.pw.h});
  Object.entries(D.absen).forEach(([k,a])=>m.set("absen/"+sid(k),a));
  Object.entries(D.apel).forEach(([k,a])=>m.set("apel/"+sid(k),a));
  return m;
}
function rebuild(){
  D.siswa=[];D.absen={};D.apel={};D.guru=[];delete D.pw;
  R.forEach((j,p)=>{const d=JSON.parse(j),c=p.split("/")[0];
    if(c==="siswa")(d.list||[]).forEach(x=>D.siswa.push({id:x.id,nis:x.nis,nama:x.nama,kelas:d.kelas}));
    else if(c==="absen")D.absen[aid(d.tgl,d.kelas,d.mapel,d.jd,d.js)]=d;
    else if(c==="apel")D.apel[apid(d.tgl,d.kelas)]=d;
    else if(p==="config/guru")D.guru=d.list||[];
    else if(p==="config/pw")D.pw=d;
  });
}
function ingest(c,snap){

function laporan(){

  document.querySelectorAll("tr.cl").forEach(t=>t.onclick=()=>{sel=t.dataset.s;render();scrollTo(0,0)});
}
render();
(async()=>{
  dl={save:async({filename,data})=>{const b=new Blob([data],{type:typeof data==="string"?"text/csv;charset=utf-8":"application/octet-stream"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}};
  const URLX=window.APPS_SCRIPT_URL;
  if(!URLX||String(URLX).startsWith("ISI_")){st="off";render();return}
  let q=[],tm=null;
  function flush(){tm=null;const b=q;q=[];fetch(URLX,{method:"POST",body:JSON.stringify({ops:b.map(x=>x.o)})}).then(r=>r.json()).then(j=>{if(!j.ok)throw new Error(j.error||"galat");b.forEach(x=>x.ok())}).catch(e=>b.forEach(x=>x.no(e)))}
  function push(o){return new Promise((ok,no)=>{q.push({o,ok,no});if(!tm)tm=setTimeout(flush,0)})}
  db={doc:p=>({set:d=>push({op:"set",path:p,data:JSON.parse(JSON.stringify(d))}),delete:()=>push({op:"del",path:p})})};
  isAdm=true;canWrite=true;
  let last="";
  async function pull(first){
    try{
      const r=await fetch(URLX,{cache:"no-store"}),j=await r.json();
      if(!j.ok)throw new Error(j.error);
      const txt=JSON.stringify(Object.keys(j.docs).sort().map(k=>[k,j.docs[k]]));
      if(txt===last&&!first)return;
      const a=document.activeElement;
      if(!first&&a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))return;
      last=txt;R.clear();
      Object.entries(j.docs).forEach(([p,d])=>R.set(p,cj(d)));
      rebuild();
      if(st==="ok"){refresh();return}
      st="ok";try{isAdmin=sessionStorage.getItem("adm")==="1"&&!!D.pw}catch(e){}render();
    }catch(e){if(st!=="ok"){st="off";render()}}
  }
  await pull(true);
  setInterval(()=>{if(!document.hidden)pull(false)},20000);
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)pull(false)});
})();
